    <style>
        :root {
            --bg-1: #140b2d;
            --bg-2: #1b2f57;
            --bg-3: #2f4b73;
            --card-bg: #ffffff;
            --text-dark: #10233f;
            --text-muted: #6b7280;
            --border: #d7e0ee;
            --primary-1: #ff7a18;
            --primary-2: #2b4c7e;
            --button-1: #243b55;
            --button-2: #141e30;
            --accent-1: #7c3aed;
            --accent-2: #2563eb;
            --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
            --radius: 24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(124, 58, 237, 0.35), transparent 35%),
                radial-gradient(circle at top right, rgba(37, 99, 235, 0.25), transparent 30%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2) 50%, var(--bg-3));
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* ── Layout ── */
        .page-wrapper {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ── Card ── */
        .card {
            width: 100%;
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.45);
        }

        .card-header {
            padding: 34px 32px 20px;
            text-align: center;
            border-bottom: 1px solid #edf2f7;
            background: #ffffff;
        }

        .logo {
            width: 64px; height: 64px;
            border-radius: 20px;
            margin: 0 auto 14px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: white;
            font-size: 1.8rem;
            box-shadow: 0 12px 28px rgba(37,99,235,0.28);
        }

        .card-header h2 {
            font-size: 1.65rem;
            color: var(--text-dark);
            margin-bottom: 6px;
            letter-spacing: -0.03em;
            font-weight: 800;
        }

        .card-header p {
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.45;
        }

        .card-body { padding: 28px 32px 34px; }

        /* ── Form ── */
        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.92rem;
        }

        .input-wrap { position: relative; }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 13px 16px;
            font-size: 0.97rem;
            color: var(--text-dark);
            outline: none;
            background: #fff;
            transition: all 0.25s ease;
        }

        input::placeholder { color: #94a3b8; }

        input:focus {
            border-color: #5b7cff;
            box-shadow: 0 0 0 4px rgba(91,124,255,0.12);
        }

        input.error-field { border-color: #ef4444; }

        .toggle-password {
            position: absolute;
            top: 50%; right: 12px;
            transform: translateY(-50%);
            border: none; background: transparent;
            cursor: pointer; font-size: 1rem;
            color: #718096; padding: 6px;
        }

        /* ── Primary button ── */
        .primary-btn {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            background: linear-gradient(135deg, var(--button-1), var(--button-2));
            box-shadow: 0 12px 28px rgba(20,30,48,0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        .primary-btn:hover { transform: translateY(-1px); box-shadow: 0 16px 34px rgba(20,30,48,0.34); opacity: 0.98; }
        .primary-btn:active { transform: translateY(0); }
        .primary-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* ── Alert messages ── */
        .alert {
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 18px;
            display: none;
            line-height: 1.45;
        }

        .alert.show { display: flex; align-items: flex-start; gap: 8px; }
        .alert-error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .alert-info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }

        /* ── Loading spinner ── */
        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Language Selector ── */
        .lang-selector-wrap {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 12px;
            border-radius: 999px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .lang-select {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }
        .lang-select option {
            background: #1e293b;
            color: #ffffff;
        }

        /* ── Responsive ── */
        @media (max-width: 560px) {
            body { padding: 16px; }
            .card-header, .card-body { padding-left: 20px; padding-right: 20px; }
            .card-header h2 { font-size: 1.45rem; }
        }
    </style>

            <p data-i18n="login_sub">Sign in with your username and password to continue</p>
        </div>

        <!-- Card Body -->
        <div class="card-body">

            <!-- Alert Notification -->
            <div class="alert alert-error" id="login-alert" role="alert"></div>

            <!-- Single, Clean Form: Only Username and Password -->
            <form id="form-login" novalidate>
                <div class="form-group">
                    <label for="login-username" data-i18n="label_username">Username</label>
                    <div class="input-wrap">
                        <input type="text" id="login-username" name="username"

                    </div>
                </div>

                <div class="form-group">
                    <label for="login-password" data-i18n="label_password">Password</label>
                    <div class="input-wrap">
                        <input type="password" id="login-password" name="password"
                               placeholder="Enter your password" autocomplete="current-password" required data-i18n-placeholder="placeholder_password" />
                        <button class="toggle-password" type="button" data-target="login-password" aria-label="Show password">👁️</button>
                    </div>
                </div>

                <button type="submit" class="primary-btn" id="btn-login" style="margin-top: 8px;" data-i18n="btn_login_submit">Sign In</button>

                    <span>Install PWA for iOS (iPhone / iPad)</span>

                Ashok Leyland Intelligent Transit &amp; Battery Fleet Operations

        </div>

    </section>
</main>

    function showAlert(type, msg) {
        const el = document.getElementById("login-alert");
        if (!el) return;
        el.className = `alert alert-${type} show`;
        el.innerHTML = `<span>${type === "error" ? "⚠️" : type === "success" ? "✅" : "ℹ️"}</span><span>${msg}</span>`;
    }

    function clearAlert() {
        const el = document.getElementById("login-alert");
        if (el) { el.className = "alert"; el.textContent = ""; }
    }

    function setLoading(btn, loading, text) {
        if (!btn) return;
        btn.disabled = loading;
        btn.innerHTML = loading ? `<span class="spinner"></span>${text}` : text;
    }

    // Toggle password visibility
    document.querySelectorAll(".toggle-password").forEach((btn) => {
        btn.addEventListener("click", () => {
            const input = document.getElementById(btn.dataset.target);
            if (!input) return;
            const isPass = input.type === "password";
            input.type = isPass ? "text" : "password";
            btn.textContent = isPass ? "🙈" : "👁️";
            btn.setAttribute("aria-label", isPass ? "Hide password" : "Show password");
        });
    });

    // Form Submission: Direct Page Entry
    document.getElementById("form-login").addEventListener("submit", function(e) {
        e.preventDefault();
        clearAlert();

        const uInput = document.getElementById("login-username");
        const pInput = document.getElementById("login-password");
        const btn = document.getElementById("btn-login");

        const rawUser = (uInput?.value || "").trim();
        const rawPass = pInput?.value || "";

        if (!rawUser) {
            showAlert("error", "Please enter your username.");
            uInput?.focus();
            return;
        }
        if (!rawPass) {
            showAlert("error", "Please enter your password.");
            pInput?.focus();
            return;
        }

        const normUser = rawUser.toLowerCase();
        const account = WEBPAGE_ACCOUNTS[normUser];

        if (!account || account.password !== rawPass) {
            showAlert("error", "Invalid username or password. Please verify your credentials and try again.");
            pInput.classList.add("error-field");
            pInput.focus();
            return;
        }

        pInput.classList.remove("error-field");
        setLoading(btn, true, "Entering designated page…");

        // Write session to both localStorage and sessionStorage
        try {
            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("userEmail", account.email);
            localStorage.setItem("userName", account.name);
            localStorage.setItem("userRole", account.role);
            localStorage.setItem("designatedPage", account.redirectUrl);
            localStorage.removeItem("smartbus_loggedout");
            localStorage.removeItem("accessMode");

            sessionStorage.setItem("isLoggedIn", "true");
            sessionStorage.setItem("userEmail", account.email);
            sessionStorage.setItem("userName", account.name);
            sessionStorage.setItem("userRole", account.role);
            sessionStorage.setItem("designatedPage", account.redirectUrl);

            if (account.redirectUrl.includes("depot=2")) {
                localStorage.setItem("selected_depot", "2");
                sessionStorage.setItem("selected_depot", "2");
            } else if (account.redirectUrl.includes("depot=1")) {
                localStorage.setItem("selected_depot", "1");
                sessionStorage.setItem("selected_depot", "1");
            }
        } catch (err) {
            console.warn("Storage error:", err);
        }

        showAlert("success", `<strong>Welcome, ${account.name}!</strong> Entering designated page: <u>${account.pageName}</u>…`);

        setTimeout(function() {
            window.location.href = account.redirectUrl;
        }, 350);
    });

    // Check if user already has an active session
    (function checkExistingSession() {
        try {
            const isLoggedOut = localStorage.getItem("smartbus_loggedout") === "1";
            const isLoggedIn = (localStorage.getItem("isLoggedIn") === "true") || (sessionStorage.getItem("isLoggedIn") === "true");
            const userName = localStorage.getItem("userName") || sessionStorage.getItem("userName");
            const designated = localStorage.getItem("designatedPage") || sessionStorage.getItem("designatedPage") || "/admin.html";

            if (isLoggedIn && !isLoggedOut && userName) {
                const sessionBox = document.getElementById("existing-session-banner");
                if (sessionBox) {
                    sessionBox.style.display = "block";
                    sessionBox.innerHTML = `
                        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                            <div>
                                <span style="font-size:0.8rem;color:#1e40af;font-weight:700;">👤 Currently Signed In: <strong>${userName}</strong></span>
                            </div>
                            <div style="display:flex;align-items:center;gap:6px;">
                                <a href="${designated}" style="font-size:0.78rem;font-weight:700;color:#2563eb;text-decoration:none;padding:4px 12px;border-radius:999px;background:#dbeafe;">
                                    Continue to Page →
                                </a>
                            </div>
                        </div>
                    `;
                }
            }
        } catch(e) {}
    })();
</script>
