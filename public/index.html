<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fleet Dashboard</title>
</head>
<body>
  <h2>Fleet Overview</h2>
  <table>
    <thead>
      <tr>
        <th>Bus ID</th>
        <th>Route</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><a href="bus-details.html?bus_id=BUS_001">BUS_001</a></td>
        <td>600F</td>
      </tr>
      <tr>
        <td><a href="bus-details.html?bus_id=BUS_002">BUS_002</a></td>
        <td>600F</td>
      </tr>
    </tbody>
  </table>

  <script>
    const fleetRows = document.querySelectorAll('tbody tr');
    fleetRows.forEach((row) => {
      const busCell = row.querySelector('td:first-child');
      const busId = busCell.textContent.trim();
      const anchor = document.createElement('a');
      anchor.href = `bus-details.html?bus_id=${encodeURIComponent(busId)}`;
      anchor.textContent = busId;
      busCell.textContent = '';
      busCell.appendChild(anchor);
    });
  </script>
</body>
</html>
