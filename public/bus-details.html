<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bus Details & Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --primary: #2563eb;
      --green: #22c55e;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0b1220, #111827 50%, #0f172a);
      color: var(--text);
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    .view-switcher {
      display: inline-flex;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px;
      gap: 6px;
    }

    .view-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .view-btn.active {
      background: var(--primary);
      color: white;
    }

    .card {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.2);
    }

    .chart-wrap {
      position: relative;
      width: 100%;
      height: 440px;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .status {
      margin: 14px 0 0;
      color: var(--muted);
      min-height: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Bus Details & Analytics</h1>
      <div class="view-switcher" aria-label="Chart view switcher">
        <button class="view-btn active" data-view="macro">Macro View (30-Day)</button>
        <button class="view-btn" data-view="micro">Micro View (Live)</button>
      </div>
    </div>

    <div class="card" style="margin-bottom: 18px;">
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 8px;">
        <div style="background: rgba(59, 130, 246, 0.08); padding: 16px; border-radius: 12px; border: 1px solid rgba(59, 130, 246, 0.2);">
          <div style="color:#94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: .08em;">Bus ID</div>
          <div id="busIdLabel" style="font-size: 1.4rem; font-weight: 700; margin-top: 8px;">-</div>
        </div>
        <div style="background: rgba(34, 197, 94, 0.08); padding: 16px; border-radius: 12px; border: 1px solid rgba(34, 197, 94, 0.2);">
          <div style="color:#94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: .08em;">Current SOC</div>
          <div id="currentSoc" style="font-size: 1.4rem; font-weight: 700; margin-top: 8px;">-</div>
        </div>
        <div style="background: rgba(168, 85, 247, 0.08); padding: 16px; border-radius: 12px; border: 1px solid rgba(168, 85, 247, 0.2);">
          <div style="color:#94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: .08em;">Last Odometer</div>
          <div id="lastOdometer" style="font-size: 1.4rem; font-weight: 700; margin-top: 8px;">-</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="chart-wrap">
        <canvas id="analyticsChart"></canvas>
      </div>
      <p id="status" class="status">Loading analytics…</p>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const busId = urlParams.get("bus_id") || "BUS_001";
    let chart = null;

    function formatTimestamp(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString();
    }

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    function destroyChart() {
      if (chart) {
        chart.destroy();
        chart = null;
      }
    }

    async function fetchBusData(view) {
      const endpoint = view === "macro"
        ? `/api/bus/${encodeURIComponent(busId)}/macro`
        : `/api/bus/${encodeURIComponent(busId)}/micro`;

      const response = await fetch(endpoint);
      if (!response.ok) {
        throw new Error(`Request failed: ${response.status}`);
      }
      return response.json();
    }

    function updateSummary(data, view) {
      if (!Array.isArray(data) || data.length === 0) return;
      if (view === "macro") {
        const latest = data[data.length - 1];
        document.getElementById("currentSoc").textContent = `${Number(latest.soc_end).toFixed(1)}%`;
      } else {
        const latest = data[data.length - 1];
        document.getElementById("currentSoc").textContent = `${Number(latest.soc).toFixed(1)}%`;
        const odometer = data[data.length - 1].odometer_km;
        document.getElementById("lastOdometer").textContent = `${Number(odometer).toFixed(1)} km`;
      }
      document.getElementById("busIdLabel").textContent = busId;
    }

    function createMacroChart(data) {
      const labels = data.map((point) => formatTimestamp(point.timestamp));
      const values = data.map((point) => Number(point.soc_end));

      return new Chart(document.getElementById("analyticsChart"), {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: `SOC End (${busId})`,
            data: values,
            borderColor: "#3b82f6",
            backgroundColor: "rgba(59, 130, 246, 0.2)",
            borderWidth: 2,
            fill: false,
            tension: 0.25
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: { legend: { display: true } },
          scales: {
            x: {
              ticks: { autoSkip: true, maxRotation: 45, minRotation: 45 },
              title: { display: true, text: "Timestamp" }
            },
            y: {
              title: { display: true, text: "SOC End (%)" },
              suggestedMin: 0,
              suggestedMax: 100
            }
          }
        }
      });
    }

    function createMicroChart(data) {
      const labels = data.map((point) => {
        const date = new Date(point.timestamp);
        return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      });
      const values = data.map((point) => Number(point.soc));

      return new Chart(document.getElementById("analyticsChart"), {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: `Live SOC (${busId})`,
            data: values,
            borderColor: "#22c55e",
            backgroundColor: "rgba(34, 197, 94, 0.2)",
            borderWidth: 2,
            fill: false,
            tension: 0.25
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: { legend: { display: true } },
          scales: {
            x: {
              ticks: { autoSkip: true, maxRotation: 45, minRotation: 45 },
              title: { display: true, text: "Time" }
            },
            y: {
              title: { display: true, text: "SOC (%)" },
              suggestedMin: 0,
              suggestedMax: 100
            }
          }
        }
      });
    }

    async function renderView(view) {
      destroyChart();
      setStatus(`Loading ${view === "macro" ? "30-day history" : "live telemetry"}...`);

      try {
        const data = await fetchBusData(view);
        if (!Array.isArray(data) || data.length === 0) {
          setStatus(`No ${view === "macro" ? "historical" : "live"} records found for ${busId}.`);
          return;
        }

        updateSummary(data, view);
        chart = view === "macro" ? createMacroChart(data) : createMicroChart(data);
        setStatus(`${view === "macro" ? "Macro view" : "Micro view"} loaded for ${busId}.`);
      } catch (error) {
        console.error(error);
        setStatus(`Could not load ${view} data for ${busId}.`);
      }
    }

    document.querySelectorAll(".view-btn").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".view-btn").forEach((btn) => btn.classList.toggle("active", btn === button));
        renderView(button.dataset.view);
      });
    });

    renderView("macro");
  </script>
</body>
</html>
