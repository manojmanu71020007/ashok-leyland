<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bus Details &amp; Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --primary: #2563eb;
      --green: #22c55e;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0b1220, #111827 50%, #0f172a);
      color: var(--text);
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: .85rem;
      font-weight: 600;
      margin-bottom: 16px;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--text); }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    .view-switcher {
      display: inline-flex;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px;
      gap: 6px;
    }

    .view-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      transition: background 0.15s, color 0.15s;
    }

    .view-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }

    .view-btn.active {
      background: var(--primary);
      color: white;
    }

    .card {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.2);
    }

    .chart-wrap {
      position: relative;
      width: 100%;
      height: 440px;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .status {
      margin: 14px 0 0;
      color: var(--muted);
      min-height: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/problem.html" class="back-link">&#8592; Back to Scheduling Dashboard</a>

    <div class="header">
      <h1 id="pageHeading">Route Telemetry &amp; Analytics</h1>
      <div class="view-switcher" aria-label="Chart view switcher">
        <button class="view-btn active" data-view="macro">Macro View (30-Day)</button>
        <button class="view-btn" data-view="micro">Micro View (Live)</button>
      </div>
    </div>

    <div class="card" style="margin-bottom: 18px;">
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 8px;">
        <div style="background: rgba(59, 130, 246, 0.08); padding: 16px; border-radius: 12px; border: 1px solid rgba(59, 130, 246, 0.2);">
          <div style="color:#94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: .08em;">Route Identifier</div>
          <div id="busIdLabel" style="font-size: 1.25rem; font-weight: 800; margin-top: 8px; word-break: break-all;">-</div>
          <div id="routeIdSub" style="font-size: .8rem; color:#94a3b8; margin-top: 4px;"></div>
        </div>
        <div style="background: rgba(34, 197, 94, 0.08); padding: 16px; border-radius: 12px; border: 1px solid rgba(34, 197, 94, 0.2);">
          <div style="color:#94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: .08em;">Current SOC</div>
          <div id="currentSoc" style="font-size: 1.4rem; font-weight: 700; margin-top: 8px;">-</div>
        </div>
        <div style="background: rgba(168, 85, 247, 0.08); padding: 16px; border-radius: 12px; border: 1px solid rgba(168, 85, 247, 0.2);">
          <div id="odoLabel" style="color:#94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: .08em;">Route Distance</div>
          <div id="lastOdometer" style="font-size: 1.4rem; font-weight: 700; margin-top: 8px;">-</div>
        </div>
        <div style="background: rgba(234, 88, 12, 0.08); padding: 16px; border-radius: 12px; border: 1px solid rgba(234, 88, 12, 0.2);">
          <div style="color:#94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: .08em;">Condition</div>
          <div id="busCondition" style="font-size: 1.4rem; font-weight: 700; margin-top: 8px;">Good</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="chart-wrap">
        <canvas id="analyticsChart"></canvas>
      </div>
      <p id="status" class="status">Loading analytics&#8230;</p>
    </div>
  </div>

  <script>
    // -----------------------------------------------------------------------
    // Read URL params
    //   route_id  = canonical numeric GTFS routeId  (primary key for graph & telemetry)
    //   bus_id    = human-readable short name (assigned bus display label)
    // -----------------------------------------------------------------------
    const urlParams    = new URLSearchParams(window.location.search);
    const routeIdParam = (urlParams.get("route_id") || "").trim();
    const busIdParam   = (urlParams.get("bus_id")   || "").trim();

    // Primary key for the graph and API calls is always route_id!
    const canonicalRouteId = routeIdParam || (busIdParam && /^\d+$/.test(busIdParam) ? busIdParam : "") || "1367";
    const apiId = canonicalRouteId;
    
    // Display labels:
    const routeTitle = `Route ${canonicalRouteId}`;
    const assignedBusName = busIdParam && busIdParam !== canonicalRouteId ? busIdParam : "";

    let chart       = null;
    let currentView = "macro";

    // -----------------------------------------------------------------------
    // Helpers
    // -----------------------------------------------------------------------
    function formatTimestamp(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString();
    }

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    function destroyChart() {
      if (chart) { chart.destroy(); chart = null; }
    }

    // -----------------------------------------------------------------------
    // API fetch
    // -----------------------------------------------------------------------
    async function fetchBusData(view) {
      const endpoint = view === "macro"
        ? `/api/bus/${encodeURIComponent(apiId)}/macro`
        : `/api/bus/${encodeURIComponent(apiId)}/micro`;
      const response = await fetch(endpoint);
      if (!response.ok) throw new Error(`Request failed: ${response.status}`);
      return response.json();
    }

    // -----------------------------------------------------------------------
    // KPI summary card
    // -----------------------------------------------------------------------
    async function updateSummary(data, view) {
      if (!Array.isArray(data) || data.length === 0) return;

      // Primary label: Route ID; secondary: Assigned bus short name
      document.getElementById("busIdLabel").textContent = routeTitle;
      const headingEl = document.getElementById("pageHeading");
      if (headingEl) {
        headingEl.textContent = `Route ${canonicalRouteId} SoC Analytics`;
      }
      const subEl = document.getElementById("routeIdSub");
      if (assignedBusName) {
        subEl.textContent = `Assigned Bus: ${assignedBusName}`;
      } else {
        subEl.textContent = `Route ID: ${canonicalRouteId}`;
      }

      const latest = data[data.length - 1];
      const liveSocVal = view === "macro" ? Number(latest.soc_end) : Number(latest.soc);
      if (Number.isFinite(liveSocVal)) {
        document.getElementById("currentSoc").textContent = `${Math.round(liveSocVal)}%`;
      }

      const odoLabel = document.getElementById("odoLabel");
      if (odoLabel) odoLabel.textContent = "Route Distance";

      try {
        const distRes     = await fetch(`/api/route-distance?bus=${encodeURIComponent(apiId)}`);
        const distPayload = await distRes.json();
        if (distPayload && distPayload.ok && Number.isFinite(distPayload.distanceKm)) {
          document.getElementById("lastOdometer").textContent = `${distPayload.distanceKm.toFixed(1)} km`;
        } else if (latest.km) {
          document.getElementById("lastOdometer").textContent = `${Number(latest.km).toFixed(1)} km`;
        } else if (latest.odometer_km) {
          document.getElementById("lastOdometer").textContent = `${Number(latest.odometer_km).toFixed(1)} km`;
        }
      } catch {
        if (latest.km) {
          document.getElementById("lastOdometer").textContent = `${Number(latest.km).toFixed(1)} km`;
        }
      }

      try {
        const stateRes     = await fetch("/api/bus-state");
        const statePayload = await stateRes.json();
        const allState     = statePayload?.state || {};
        const numericId    = apiId.replace(/\D/g, "");
        const state = allState[apiId]
          || allState[numericId]
          || Object.entries(allState).find(([k]) =>
              k === apiId || k === numericId ||
              k.replace(/\D/g, "") === numericId
            )?.[1];

        if (state && Number.isFinite(Number(state.soc))) {
          document.getElementById("currentSoc").textContent = `${Number(state.soc).toFixed(0)}%`;
        }
        if (state && state.condition) {
          const condEl = document.getElementById("busCondition");
          const isGood = state.condition === "Good";
          condEl.textContent  = isGood ? "Good" : "Maintenance Req.";
          condEl.style.color  = isGood ? "#16a34a" : "#dc2626";
        }
      } catch {}
    }

    // -----------------------------------------------------------------------
    // Charts
    // -----------------------------------------------------------------------
    function createMacroChart(data) {
      const labels = data.map((p) => formatTimestamp(p.timestamp));
      const values = data.map((p) => Number(p.soc_end));
      return new Chart(document.getElementById("analyticsChart"), {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: `Route ${canonicalRouteId} 30-Day SOC (%)`,
            data: values,
            borderColor: "#3b82f6",
            backgroundColor: "rgba(59, 130, 246, 0.2)",
            borderWidth: 2,
            fill: false,
            tension: 0.25
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: { legend: { display: true } },
          scales: {
            x: {
              ticks: { autoSkip: true, maxRotation: 45, minRotation: 45 },
              title: { display: true, text: "Date" }
            },
            y: {
              title: { display: true, text: "SOC End (%)" },
              suggestedMin: 0, suggestedMax: 100
            }
          }
        }
      });
    }

    function createMicroChart(data) {
      const labels = data.map((p) => {
        const d = new Date(p.timestamp);
        return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      });
      const values = data.map((p) => Number(p.soc));
      return new Chart(document.getElementById("analyticsChart"), {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: `Route ${canonicalRouteId} Live Telemetry SOC (%)`,
            data: values,
            borderColor: "#22c55e",
            backgroundColor: "rgba(34, 197, 94, 0.2)",
            borderWidth: 2,
            fill: false,
            tension: 0.25
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: { legend: { display: true } },
          scales: {
            x: {
              ticks: { autoSkip: true, maxRotation: 45, minRotation: 45 },
              title: { display: true, text: "Time" }
            },
            y: {
              title: { display: true, text: "SOC (%)" },
              suggestedMin: 0, suggestedMax: 100
            }
          }
        }
      });
    }

    // -----------------------------------------------------------------------
    // Render view (macro | micro)
    // -----------------------------------------------------------------------
    async function renderView(view) {
      currentView = view;
      destroyChart();
      setStatus(`Loading ${view === "macro" ? "30-day history" : "live telemetry"} for Route ${canonicalRouteId}\u2026`);

      // Sync button active states
      document.querySelectorAll(".view-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.view === view);
      });

      try {
        const data = await fetchBusData(view);
        if (!Array.isArray(data) || data.length === 0) {
          setStatus(`No ${view === "macro" ? "historical" : "live"} records found for Route ${canonicalRouteId}.`);
          return;
        }
        updateSummary(data, view);
        chart = view === "macro" ? createMacroChart(data) : createMicroChart(data);
        setStatus(`${view === "macro" ? "Macro view (30-day)" : "Micro view (live)"} loaded for Route ${canonicalRouteId}.`);
      } catch (error) {
        console.error(error);
        setStatus(`Could not load ${view} data for ${displayLabel}: ${error.message}`);
      }
    }

    // -----------------------------------------------------------------------
    // View-switcher click handlers  (this was MISSING in the original file)
    // -----------------------------------------------------------------------
    document.querySelectorAll(".view-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const view = btn.dataset.view;
        if (view && view !== currentView) {
          renderView(view);
        }
      });
    });

    // -----------------------------------------------------------------------
    // Live polling — refreshes the active view's chart every 10 s
    // -----------------------------------------------------------------------
    let pollIntervalId = null;
    function startLivePolling() {
      if (pollIntervalId) clearInterval(pollIntervalId);
      pollIntervalId = setInterval(async () => {
        try {
          const data = await fetchBusData(currentView);
          if (Array.isArray(data) && data.length > 0) {
            await updateSummary(data, currentView);
            if (chart) {
              const labels = currentView === "macro"
                ? data.map((p) => formatTimestamp(p.timestamp))
                : data.map((p) => {
                    const d = new Date(p.timestamp);
                    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
                  });
              const values = currentView === "macro"
                ? data.map((p) => Number(p.soc_end))
                : data.map((p) => Number(p.soc));
              chart.data.labels = labels;
              chart.data.datasets[0].data = values;
              chart.data.datasets[0].label = currentView === "macro"
                ? `Route ${canonicalRouteId} 30-Day SOC (%)`
                : `Route ${canonicalRouteId} Live Telemetry SOC (%)`;
              chart.update("none");
            }
          }
        } catch {}
      }, 10000);
    }

    // -----------------------------------------------------------------------
    // Boot
    // -----------------------------------------------------------------------
    renderView("macro");
    startLivePolling();
  </script>
</body>
</html>
