<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bus Battery &amp; Telemetry Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --primary: #2563eb;
      --green: #22c55e;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0b1220, #111827 50%, #0f172a);
      color: var(--text);
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: .85rem;
      font-weight: 600;
      margin-bottom: 16px;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--text); }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    .view-switcher {
      display: inline-flex;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px;
      gap: 6px;
    }

    .view-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      transition: background 0.15s, color 0.15s;
    }

    .view-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }

    .view-btn.active {
      background: var(--primary);
      color: white;
    }

    .card {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.2);
    }

    .chart-wrap {
      position: relative;
      width: 100%;
      height: 440px;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .status {
      margin: 14px 0 0;
      color: var(--muted);
      min-height: 24px;
    }

    .route-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 8px;
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #93c5fd;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/problem.html" class="back-link">&#8592; Back to Scheduling Dashboard</a>

    <div class="header">
      <h1 id="pageHeading">Bus SoC &amp; Battery Analytics</h1>
      <div class="view-switcher" aria-label="Chart view switcher">
        <button class="view-btn active" data-view="macro">Macro View (30-Day)</button>
        <button class="view-btn" data-view="micro">Micro View (Live)</button>
      </div>
    </div>

    <div class="card" style="margin-bottom: 18px;">
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 8px;">
        <div style="background: rgba(59, 130, 246, 0.08); padding: 16px; border-radius: 12px; border: 1px solid rgba(59, 130, 246, 0.2);">
          <div style="color:#94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: .08em;">Physical Vehicle</div>
          <div id="busIdLabel" style="font-size: 1.25rem; font-weight: 800; margin-top: 8px; word-break: break-all;">-</div>
          <div id="routeIdSub" class="route-badge">Assigned: -</div>
        </div>
        <div style="background: rgba(34, 197, 94, 0.08); padding: 16px; border-radius: 12px; border: 1px solid rgba(34, 197, 94, 0.2);">
          <div style="color:#94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: .08em;">Current Battery (SoC)</div>
          <div id="currentSoc" style="font-size: 1.4rem; font-weight: 700; margin-top: 8px;">-</div>
        </div>
        <div style="background: rgba(168, 85, 247, 0.08); padding: 16px; border-radius: 12px; border: 1px solid rgba(168, 85, 247, 0.2);">
          <div id="odoLabel" style="color:#94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: .08em;">Assigned Route Distance</div>
          <div id="lastOdometer" style="font-size: 1.4rem; font-weight: 700; margin-top: 8px;">-</div>
        </div>
        <div style="background: rgba(234, 88, 12, 0.08); padding: 16px; border-radius: 12px; border: 1px solid rgba(234, 88, 12, 0.2);">
          <div style="color:#94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: .08em;">Cleanliness &amp; Condition</div>
          <div id="busCondition" style="font-size: 1.4rem; font-weight: 700; margin-top: 8px;">Good</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="chart-wrap">
        <canvas id="analyticsChart"></canvas>
      </div>
      <p id="status" class="status">Loading analytics&#8230;</p>
    </div>
  </div>

  <script>
    // -----------------------------------------------------------------------
    // Vehicle-Centric Analytics
    //   unique_id = Physical Bus Asset ID (e.g. "BUS-01".."BUS-54")
    //   bus_id    = Physical Bus or Route Short Name (e.g. "401-A")
    //   route_id  = Assigned/Default GTFS Route ID (e.g. "1367")
    // -----------------------------------------------------------------------
    const urlParams  = new URLSearchParams(window.location.search);
    const busParam   = (urlParams.get("unique_id") || urlParams.get("uniqueId") || urlParams.get("bus_id") || urlParams.get("bus") || "").trim();
    const routeParam = (urlParams.get("route_id") || "").trim();

    // Primary vehicle identity
    let searchKey            = busParam || routeParam || "BUS-01";
    let physicalBusName      = busParam || "";
    let assignedRouteId      = routeParam || "";
    let assignedRouteDisplay = "";

    let chart          = null;
    let currentView    = "macro";
    let pollIntervalId = null;

    function formatTimestamp(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleDateString([], { month: "short", day: "numeric" });
    }

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    function destroyChart() {
      if (chart) { chart.destroy(); chart = null; }
    }

    // -----------------------------------------------------------------------
    // Fetch Summary Metadata (Vehicle uniqueId, assigned route, distance, condition)
    // -----------------------------------------------------------------------
    async function fetchSummary() {
      try {
        const res = await fetch(`/api/bus/${encodeURIComponent(searchKey)}/summary`);
        if (res.ok) {
          const info = await res.json();
          if (info.ok) {
            physicalBusName = info.uniqueId || info.busName || searchKey;
            searchKey = physicalBusName;
            assignedRouteId = info.assignedRouteId || info.routeId || "";
            assignedRouteDisplay = info.assignedRouteDisplay || (assignedRouteId ? `Route ${assignedRouteId}` : "");

            // Update UI elements
            document.getElementById("pageHeading").textContent = `Vehicle ${physicalBusName} Battery Analytics`;
            document.getElementById("busIdLabel").textContent = physicalBusName;
            const odText = (info.origin && info.destination) ? ` • ${info.origin} ➔ ${info.destination}` : "";
            document.getElementById("routeIdSub").textContent = assignedRouteDisplay ? `Assigned: ${assignedRouteDisplay}${odText}` : "Assigned: Active";

            if (Number.isFinite(Number(info.soc))) {
              document.getElementById("currentSoc").textContent = `${Math.round(info.soc)}%`;
            }
            if (Number.isFinite(Number(info.distanceKm))) {
              document.getElementById("lastOdometer").textContent = `${Number(info.distanceKm).toFixed(1)} km`;
            }
            if (info.condition) {
              const condEl = document.getElementById("busCondition");
              const isGood = info.condition === "Good";
              condEl.textContent = isGood ? "Good" : "Maintenance Req.";
              condEl.style.color = isGood ? "#16a34a" : "#dc2626";
            }
            return info;
          }
        }
      } catch (err) {
        console.warn("Could not fetch summary:", err);
      }
      return null;
    }

    // -----------------------------------------------------------------------
    // Fetch Chart Data (Keyed by physical vehicle name)
    // -----------------------------------------------------------------------
    async function fetchBusData(view) {
      const targetId = physicalBusName || searchKey;
      const endpoint = view === "macro"
        ? `/api/bus/${encodeURIComponent(targetId)}/macro`
        : `/api/bus/${encodeURIComponent(targetId)}/micro`;
      const response = await fetch(endpoint);
      if (!response.ok) throw new Error(`Request failed: ${response.status}`);
      return response.json();
    }

    // -----------------------------------------------------------------------
    // Update KPI Card from Latest Data Point
    // -----------------------------------------------------------------------
    function updateKpiFromData(data, view) {
      if (!Array.isArray(data) || data.length === 0) return;
      const latest = data[data.length - 1];
      const liveSocVal = view === "macro" ? Number(latest.soc_end) : Number(latest.soc);
      if (Number.isFinite(liveSocVal)) {
        document.getElementById("currentSoc").textContent = `${Math.round(liveSocVal)}%`;
      }
      if (latest.km) {
        document.getElementById("lastOdometer").textContent = `${Number(latest.km).toFixed(1)} km`;
      } else if (latest.odometer_km) {
        document.getElementById("lastOdometer").textContent = `${Number(latest.odometer_km).toFixed(1)} km`;
      }
    }

    // -----------------------------------------------------------------------
    // Charts (Rendered for the physical vehicle name)
    // -----------------------------------------------------------------------
    function createMacroChart(data) {
      const labels = data.map((p) => formatTimestamp(p.timestamp));
      const values = data.map((p) => Number(p.soc_end));
      const busLabel = physicalBusName || searchKey;
      return new Chart(document.getElementById("analyticsChart"), {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: `Bus ${busLabel} 30-Day Battery Trend (SoC %)`,
            data: values,
            borderColor: "#3b82f6",
            backgroundColor: "rgba(59, 130, 246, 0.2)",
            borderWidth: 2.5,
            pointRadius: 3,
            fill: true,
            tension: 0.25
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { display: true },
            tooltip: {
              callbacks: {
                label: (ctx) => `Battery SoC: ${ctx.parsed.y}% (${assignedRouteDisplay || 'Assigned Route'})`
              }
            }
          },
          scales: {
            x: {
              ticks: { autoSkip: true, maxRotation: 45, minRotation: 45 },
              title: { display: true, text: "Date" }
            },
            y: {
              title: { display: true, text: "State of Charge (%)" },
              min: 0, max: 100
            }
          }
        }
      });
    }

    function createMicroChart(data) {
      const labels = data.map((p) => {
        const d = new Date(p.timestamp);
        return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      });
      const values = data.map((p) => Number(p.soc));
      const busLabel = physicalBusName || searchKey;
      return new Chart(document.getElementById("analyticsChart"), {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: `Bus ${busLabel} Live Telemetry (SoC %)`,
            data: values,
            borderColor: "#22c55e",
            backgroundColor: "rgba(34, 197, 94, 0.2)",
            borderWidth: 2.5,
            pointRadius: 3,
            fill: true,
            tension: 0.25
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { display: true },
            tooltip: {
              callbacks: {
                label: (ctx) => `Live SoC: ${ctx.parsed.y}% (${assignedRouteDisplay || 'Assigned Route'})`
              }
            }
          },
          scales: {
            x: {
              ticks: { autoSkip: true, maxRotation: 45, minRotation: 45 },
              title: { display: true, text: "Timestamp" }
            },
            y: {
              title: { display: true, text: "State of Charge (%)" },
              min: 0, max: 100
            }
          }
        }
      });
    }

    // -----------------------------------------------------------------------
    // Render View (macro | micro)
    // -----------------------------------------------------------------------
    async function renderView(view) {
      currentView = view;
      destroyChart();
      const busLabel = physicalBusName || searchKey;
      setStatus(`Loading ${view === "macro" ? "30-day battery log" : "live telemetry"} for Bus ${busLabel}\u2026`);

      document.querySelectorAll(".view-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.view === view);
      });

      try {
        const data = await fetchBusData(view);
        if (!Array.isArray(data) || data.length === 0) {
          setStatus(`No ${view === "macro" ? "historical" : "live"} records found for Bus ${busLabel}.`);
          return;
        }
        updateKpiFromData(data, view);
        chart = view === "macro" ? createMacroChart(data) : createMicroChart(data);
        setStatus(`${view === "macro" ? "Macro view (30-day battery log)" : "Micro view (live battery telemetry)"} loaded for Bus ${busLabel}.`);
      } catch (error) {
        console.error(error);
        setStatus(`Could not load ${view} data for Bus ${busLabel}: ${error.message}`);
      }
    }

    // -----------------------------------------------------------------------
    // Switch View Buttons
    // -----------------------------------------------------------------------
    document.querySelectorAll(".view-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const view = btn.dataset.view;
        if (view && view !== currentView) {
          renderView(view);
        }
      });
    });

    // -----------------------------------------------------------------------
    // Live Polling — refreshes the active view's chart and KPI every 10 s
    // -----------------------------------------------------------------------
    function startLivePolling() {
      if (pollIntervalId) clearInterval(pollIntervalId);
      pollIntervalId = setInterval(async () => {
        try {
          await fetchSummary();
          const data = await fetchBusData(currentView);
          if (Array.isArray(data) && data.length > 0) {
            updateKpiFromData(data, currentView);
            if (chart) {
              const labels = currentView === "macro"
                ? data.map((p) => formatTimestamp(p.timestamp))
                : data.map((p) => {
                    const d = new Date(p.timestamp);
                    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
                  });
              const values = currentView === "macro"
                ? data.map((p) => Number(p.soc_end))
                : data.map((p) => Number(p.soc));
              const busLabel = physicalBusName || searchKey;
              chart.data.labels = labels;
              chart.data.datasets[0].data = values;
              chart.data.datasets[0].label = currentView === "macro"
                ? `Bus ${busLabel} 30-Day Battery Trend (SoC %)`
                : `Bus ${busLabel} Live Telemetry (SoC %)`;
              chart.update("none");
            }
          }
        } catch (e) {}
      }, 10000);
    }

    // -----------------------------------------------------------------------
    // Boot
    // -----------------------------------------------------------------------
    (async function init() {
      await fetchSummary();
      await renderView("macro");
      startLivePolling();
    })();
  </script>
</body>
</html>
